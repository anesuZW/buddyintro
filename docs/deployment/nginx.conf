# BuddyIntro — production Nginx reverse proxy (InterServer VPS)
# Place at: /etc/nginx/sites-available/buddyintro.conf
# Enable: ln -s .../buddyintro.conf /etc/nginx/sites-enabled/
# Test: nginx -t && systemctl reload nginx

upstream buddyintro_app {
    # PM2 cluster listens on PORT (default 3000)
    server 127.0.0.1:3000;
    keepalive 32;
}

# Redirect HTTP → HTTPS (adjust server_name)
server {
    listen 80;
    listen [::]:80;
    server_name buddyintro.com www.buddyintro.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name buddyintro.com www.buddyintro.com;

    # --- TLS (Let's Encrypt / Cloudflare origin cert) ---
    ssl_certificate     /etc/letsencrypt/live/buddyintro.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/buddyintro.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # --- Upload limit (must match app MAX_UPLOAD_MB = 25) ---
    client_max_body_size 101m;
    client_body_timeout 120s;

    # --- Gzip ---
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    # brotli: enable nginx-module-brotli if installed
    # brotli on;
    # brotli_types text/plain text/css application/json application/javascript text/xml application/xml;

    # --- Security headers (app middleware also sets CSP/HSTS) ---
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), notifications=(self)" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # --- Static uploads (when MEDIA_PROVIDER=local) ---
    location /uploads/ {
        alias /home/buddyintro/shared/uploads/;
        access_log off;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # --- Next static (optional direct serve from standalone) ---
    location /_next/static/ {
        alias /home/buddyintro/app/.next/standalone/.next/static/;
        access_log off;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /icons/ {
        alias /home/buddyintro/app/.next/standalone/public/icons/;
        access_log off;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /sw.js {
        alias /home/buddyintro/app/.next/standalone/public/sw.js;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # --- Health (no auth, for load balancer / uptime) ---
    location = /api/health {
        proxy_pass http://buddyintro_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }

    # --- WebSocket / Supabase realtime (browser connects to Supabase directly; keep for future) ---
    location / {
        proxy_pass http://buddyintro_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }
}
