# BuddyIntro — Nginx reverse proxy (production VPS)
#
# Install: sudo cp deployment/templates/nginx-buddyintro.conf /etc/nginx/sites-available/buddyintro
#          sudo ln -sf /etc/nginx/sites-available/buddyintro /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
#
# CRITICAL: Default nginx client_max_body_size is 1m — uploads fail with HTTP 413
# until this is set to at least 25m (matches app MAX_UPLOAD_BYTES).

upstream buddyintro_app {
  server 127.0.0.1:3000;
  keepalive 32;
}

server {
  listen 80;
  listen [::]:80;
  server_name buddyintro.com www.buddyintro.com;

  # Allow introduction media + voice note uploads (app limit: 25 MB)
  client_max_body_size 101m;
  client_body_timeout 120s;

  # Long-running uploads
  proxy_read_timeout 120s;
  proxy_send_timeout 120s;
  proxy_connect_timeout 30s;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

  location /uploads/ {
    alias /home/buddyintro/shared/uploads/;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
  }

  location /_next/static/ {
    alias /home/buddyintro/app/.next/standalone/.next/static/;
    access_log off;
    expires 365d;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location /icons/ {
    alias /home/buddyintro/app/.next/standalone/public/icons/;
    access_log off;
    expires 365d;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location = /sw.js {
    alias /home/buddyintro/app/.next/standalone/public/sw.js;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  location / {
    proxy_pass http://buddyintro_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "";
  }
}

# After TLS is configured (certbot), duplicate the server block for listen 443 ssl.
